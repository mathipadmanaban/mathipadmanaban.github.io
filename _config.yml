# Site Settings
locale: "en-US"
title: "Gandhimathi Padmanaban"
subtitle: ""
name: "Gandhimathi Padmanaban"
description: "I build and evaluate adaptable AI systems that are driven and constrained by physical measurements from multimodal data in safety-critical settings involving human interaction. Ph.D., Industrial and Systems Engineering, University of Michigan-Dearborn."
url: "https://mathipadmanaban.github.io"
repository: "mathipadmanaban/mathipadmanaban.github.io"
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

include:
  - _pages

exclude:
  - _backup_2026-09-05
  - _retired_2026-10-13
  - _to_delete
  - OPTIONAL_ENHANCEMENTS.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - vendor

sass:
  sass_dir: assets/css
  style: compressed

# Site Author
author:
  name: "Gandhimathi Padmanaban"
  avatar: "/assets/images/mathi-profile.png"
  bio: "Computer Vision · Machine Learning · Human-Centered Automation"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:gmathi@umich.edu"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/mathipadmanaban67/"
    - label: "ResearchGate"
      icon: "fab fa-fw fa-researchgate"
      url: "https://www.researchgate.net/profile/Gandhimathi-Padmanaban"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-5143-8948"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=aNWRkHIAAAAJ"

# Site Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/mathipadmanaban"

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
